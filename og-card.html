<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OG Card — Muhammad Abdullah</title>
  <!--
    HOW TO EXPORT THIS AS og-image.png:
    1. Run `npm run dev` and open http://localhost:5173/og-card.html in Chrome
    2. Open DevTools → toggle device toolbar (Ctrl+Shift+M)
    3. Set custom dimensions: Width 1200 × Height 630
    4. Open command palette (Ctrl+Shift+P) → type "screenshot" → "Capture full size screenshot"
    5. Save the file as  public/images/og-image.png
  -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f8fafc;
      display: flex;
      align-items: stretch;
    }

    /* Left accent bar */
    .accent-bar {
      width: 10px;
      background: linear-gradient(to bottom, #4f46e5, #3730a3);
      flex-shrink: 0;
    }

    /* Main card area */
    .card {
      flex: 1;
      display: flex;
      align-items: center;
      padding: 0 72px;
      gap: 56px;
      background: #ffffff;
      position: relative;
    }

    /* Subtle background decoration */
    .card::before {
      content: '';
      position: absolute;
      top: -120px;
      right: -120px;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(79,70,229,0.06) 0%, transparent 70%);
      pointer-events: none;
    }

    .card::after {
      content: '';
      position: absolute;
      bottom: -80px;
      left: 200px;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(55,48,163,0.04) 0%, transparent 70%);
      pointer-events: none;
    }

    /* Avatar */
    .avatar {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      border: 4px solid #e0e7ff;
      box-shadow: 0 8px 32px rgba(79,70,229,0.15);
    }

    /* Text block */
    .text {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #eef2ff;
      color: #4f46e5;
      font-size: 13px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 100px;
      border: 1px solid #c7d2fe;
      width: fit-content;
      margin-bottom: 4px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
    }

    .name {
      font-size: 48px;
      font-weight: 800;
      color: #0f172a;
      line-height: 1.1;
      letter-spacing: -0.03em;
    }

    .title {
      font-size: 22px;
      font-weight: 600;
      color: #4f46e5;
    }

    .tagline {
      font-size: 16px;
      color: #64748b;
      line-height: 1.5;
      max-width: 480px;
    }

    .divider {
      width: 48px;
      height: 3px;
      background: linear-gradient(to right, #4f46e5, #818cf8);
      border-radius: 2px;
      margin: 4px 0;
    }

    .domain-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }

    .domain {
      font-size: 15px;
      font-weight: 600;
      color: #4f46e5;
      letter-spacing: 0.01em;
    }

    .tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 2px;
    }

    .tag {
      font-size: 12px;
      font-weight: 500;
      color: #475569;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      padding: 3px 10px;
      border-radius: 100px;
    }
  </style>
</head>
<body>

  <div class="accent-bar"></div>

  <div class="card">
    <img class="avatar" src="./images/profile.jpeg" alt="Muhammad Abdullah" />

    <div class="text">
      <!-- <div class="badge">
        <span class="dot"></span>
        Open to Work
      </div> -->

      <div class="name">Muhammad Abdullah</div>
      <div class="title">Full Stack Developer</div>

      <div class="divider"></div>

      <div class="tagline">
        Transforming ideas into seamless digital experiences.<br />
        3+ years · MERN / PERN · AI &amp; LLMs
      </div>

      <div class="tags">
        <span class="tag">Node.js</span>
        <span class="tag">React</span>
        <span class="tag">TypeScript</span>
        <span class="tag">PostgreSQL</span>
        <span class="tag">Docker</span>
        <span class="tag">LLMs</span>
      </div>

      <div class="domain-row">
        <div class="domain">🌐 abdullah.weinnovate.net</div>
      </div>
    </div>
  </div>

</body>
</html>
